# Lint, build and vulnerability-audit both halves of the app. Runs on PRs (so
# Dependabot bumps get a pass/fail signal before merge), on pushes to main, and
# weekly — new advisories get published against versions we already pin, so an
# unchanged lockfile can still go red.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Production deps only: dev tooling (nodemon → chokidar → braces) never
      # ships to users, and its advisories have no fix to move to.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - name: Smoke test
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from app.main import app
          r = TestClient(app).get('/api/health')
          assert r.status_code == 200, r.text
          "
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  # The offline model and the projections workflow's scripts; mainly so a
  # Dependabot bump to tools/analysis/requirements.txt gets a pass/fail signal
  analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/analysis
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: tools/analysis/requirements.txt
      - run: pip install -r requirements.txt
      - name: Import every script
        run: python -c "import common, evaluate, features, history, points_model, projections, publish_projections, solver, team_model"
